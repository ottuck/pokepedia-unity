# 순수 C# 도메인 테스트 (docs/PROJECT.md 10.5)
# Unity 에디터·라이선스 없이 Assets/Scripts/{Domain,Content,Application} 과
# Assets/Tests/EditMode 를 링크한 Tests.Dotnet 프로젝트를 dotnet test 로 돌린다.
name: domain-tests

# Actions 사용 시간을 아끼려고 최소한으로만 돈다.
# - PR 에서만 돈다. 브랜치 push·main 병합 push 에서는 돌지 않는다(main 은 PR squash 병합으로만 바뀌므로 PR 에서 이미 검사됨).
# - 테스트가 컴파일하는 코드가 바뀔 때만 돈다. 문서·에셋·Unity 화면 코드만 바뀐 PR 에서는 돌지 않는다.
# - 초안(draft) PR 에서는 돌지 않는다. 같은 PR 에 새 push 가 오면 이전 실행을 취소한다.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Assets/Scripts/Domain/**"
      - "Assets/Scripts/Content/**"
      - "Assets/Scripts/Application/**"
      - "Assets/Tests/EditMode/**"
      - "Tests.Dotnet/**"
      - ".github/workflows/domain-tests.yml"
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: read

concurrency:
  group: domain-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: dotnet test
        run: dotnet test Tests.Dotnet --configuration Release

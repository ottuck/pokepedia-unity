# 순수 C# 도메인 테스트 (설계 문서 10.5)
# Unity 에디터·라이선스 없이 Assets/Scripts/{Domain,Content,Application} 과
# Assets/Tests/EditMode 를 링크한 Tests.Dotnet 프로젝트를 dotnet test 로 돌린다.
name: domain-tests

# 테스트가 컴파일하는 코드가 바뀔 때만 돈다. 문서·에셋·Unity 화면 코드만 바뀐 커밋에서는 돌지 않는다.
on:
  push:
    paths:
      - "Assets/Scripts/Domain/**"
      - "Assets/Scripts/Content/**"
      - "Assets/Scripts/Application/**"
      - "Assets/Tests/EditMode/**"
      - "Tests.Dotnet/**"
      - ".github/workflows/domain-tests.yml"
  pull_request:
    paths:
      - "Assets/Scripts/Domain/**"
      - "Assets/Scripts/Content/**"
      - "Assets/Scripts/Application/**"
      - "Assets/Tests/EditMode/**"
      - "Tests.Dotnet/**"
      - ".github/workflows/domain-tests.yml"
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: read

concurrency:
  group: domain-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: dotnet test
        run: dotnet test Tests.Dotnet --configuration Release --logger "console;verbosity=normal"

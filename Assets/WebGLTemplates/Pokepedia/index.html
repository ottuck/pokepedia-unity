<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0f380f; overflow: hidden; overscroll-behavior: none; touch-action: none; }
      /* 게임보이 비율(10:9)을 유지하며 가용 영역(안전 영역 제외)에 맞춘다 */
      #stage { position: fixed; inset: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        display: flex; align-items: center; justify-content: center; }
      #frame { aspect-ratio: 10 / 9; width: min(100%, calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 10 / 9)); }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #0f380f; outline: none; image-rendering: pixelated; }
      /* 로딩 화면: 첫 방문은 4G 에서 10초 넘게 걸리므로(PROJECT.md 10.3) 진행 막대와 안내를 보여 준다 */
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        background: #0f380f; color: #9bbc0f; font: bold 12px/1.4 monospace; text-align: center; padding: 16px; }
      #loading-title { font-size: 18px; letter-spacing: 2px; color: #8bac0f; }
      #loading-bar { width: min(200px, 70vw); height: 10px; border: 2px solid #8bac0f; padding: 2px; box-sizing: content-box; }
      #loading-fill { height: 100%; width: 0; background: #9bbc0f; image-rendering: pixelated; }
      #loading-tip { font-weight: normal; opacity: 0.8; max-width: 260px; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="frame"><canvas id="unity-canvas" tabindex="0"></canvas></div></div>
    <div id="loading">
      <div id="loading-title">POKEPEDIA BATTLE</div>
      <div id="loading-bar"><div id="loading-fill"></div></div>
      <div id="loading-text">0%</div>
      <div id="loading-tip"></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var loadingFill = document.querySelector("#loading-fill");
      var loadingText = document.querySelector("#loading-text");
      // 안내 문구 언어: Pokepedia 는 ?lang= 을 붙여 띄우고, 없으면 브라우저 언어
      var lang = (new URLSearchParams(location.search).get("lang") || navigator.language || "ko").slice(0, 2);
      var TEXT = {
        ko: { tip: "처음 불러올 때는 조금 걸려요. 다음부터는 빨라요.", ready: "준비 중…", failed: "불러오지 못했어요. 새로고침해 주세요." },
        en: { tip: "The first load takes a moment. It is faster next time.", ready: "Getting ready…", failed: "Could not load. Please refresh." },
        ja: { tip: "はじめての よみこみは すこし じかんが かかります。", ready: "じゅんびちゅう…", failed: "よみこめませんでした。 リロードしてください。" }
      }[lang] || null;
      if (!TEXT) TEXT = { tip: "The first load takes a moment. It is faster next time.", ready: "Getting ready…", failed: "Could not load. Please refresh." };
      document.querySelector("#loading-tip").textContent = TEXT.tip;

      // 호스트(Pokepedia) origin 허용 목록. init 수신 검증과 jslib 의 postMessage 대상에 함께 쓴다.
      // 규약: docs/PROJECT.md 9.2
      window.pokeHost = {
        instance: null,
        pending: [],
        allowedOrigins: ["https://pokepedia.dev", "https://www.pokepedia.dev", "http://localhost:3000", "http://localhost:8000"]
      };
      // Pokepedia 의 Vercel Preview 는 PR 마다 주소가 달라 목록에 미리 넣을 수 없다. 부모 페이지 origin 이
      // 이 계정의 Pokepedia Preview 형식이면 목록에 더한다(9.2). ancestorOrigins 가 없는 브라우저(Firefox)는 referrer 로 본다.
      (function () {
        var PREVIEW = /^https:\/\/pokepedia-[a-z0-9-]+-vison901-gmailcoms-projects\.vercel\.app$/;
        try {
          var parent = (location.ancestorOrigins && location.ancestorOrigins[0]) || (document.referrer && new URL(document.referrer).origin);
          if (parent && PREVIEW.test(parent)) window.pokeHost.allowedOrigins.push(parent);
        } catch (e) {}
      })();

      // iframe 안에서 방향키·스페이스가 부모 페이지를 스크롤하지 않도록 막는다
      var BLOCKED = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"];
      window.addEventListener("keydown", function (e) { if (BLOCKED.indexOf(e.code) >= 0) e.preventDefault(); }, { passive: false });
      // iPhone 은 무음 모드(측면 스위치)면 Web Audio(=Unity 소리)를 끈다. "playback" 이면 동영상처럼 소리가 난다(iOS 17+, 없으면 무시).
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
      // 클릭/터치 시 캔버스에 포커스를 줘야 키 입력이 iframe 안에서 Unity 로 전달된다
      ["pointerdown", "touchstart"].forEach(function (ev) { document.addEventListener(ev, function () { canvas.focus(); window.focus(); }, { passive: true }); });

      // 호스트 → Unity: origin 검증 후 전달. Unity 로딩 전에 오면 보관했다가 전달한다.
      window.addEventListener("message", function (e) {
        if (window.pokeHost.allowedOrigins.indexOf(e.origin) < 0) return;
        var d = e.data;
        if (!d || typeof d !== "object" || d.type !== "init") return;
        var json = JSON.stringify(d);
        if (window.pokeHost.instance) window.pokeHost.instance.SendMessage("HostBridge", "OnHostInit", json);
        else window.pokeHost.pending.push(json);
      });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Unity 는 처리되지 않은 오류를 alert 로 띄운다. 소리 하나를 풀지 못한 오류(게임은 계속 돈다)는 콘솔에만 남긴다.
        // true 를 돌려주면 기본 alert 를 건너뛴다. 그 밖의 오류는 기본 동작 그대로.
        errorHandler: function (message) {
          if (/EncodingError|Decoding failed|decodeAudioData/.test(String(message))) { console.warn("[audio] " + message); return true; }
          return false;
        },
      }, function (p) {
        // 0~0.9 는 내려받기, 그 뒤는 엔진 초기화
        loadingFill.style.width = Math.round(p * 100) + "%";
        loadingText.textContent = p >= 0.9 ? TEXT.ready : Math.round(p * 100) + "%";
      })
      .then(function (instance) {
        window.pokeHost.instance = instance;
        loading.style.display = "none";
        window.pokeHost.pending.splice(0).forEach(function (j) { instance.SendMessage("HostBridge", "OnHostInit", j); });
      }).catch(function (m) { loadingText.textContent = TEXT.failed; console.error(m); });
    </script>
  </body>
</html>

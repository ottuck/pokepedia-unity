<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!-- 시작 화면 글꼴: 제목·버튼은 Black Han Sans(게임·포스터에 흔한 굵은 한글 디스플레이), 본문은 Pokepedia 와 같은 Noto Sans KR.
         가나는 Noto Sans JP. 필요한 글자 조각만 내려받고, 막히면 시스템 글꼴 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&family=Noto+Sans+JP:wght@700;900&display=swap">
    <style>
      /* 10:9 게임 밖 여백(Pokepedia 가 크기를 딱 맞추면 거의 없다)은 어두운 화면 테두리 색 */
      html, body { margin: 0; padding: 0; height: 100%; background: #262a35; overflow: hidden; overscroll-behavior: none; touch-action: none; }
      /* 게임보이 비율(10:9)을 유지하며 가용 영역(안전 영역 제외)에 맞춘다 */
      #stage { position: fixed; inset: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        display: flex; align-items: center; justify-content: center; }
      #frame { position: relative; container-type: inline-size; aspect-ratio: 10 / 9;
        width: min(100%, calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 10 / 9)); }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #0b1030; outline: none; image-rendering: pixelated; }

      /*
       * 시작 화면(로딩 → 시작 → 연결 중 / 연결 실패 / 띠부씰 없음). 레트로 도트는 게임 안(VS 화면부터)만 쓰고, 여기는 게임 타이틀답게
       * (2026-10-17 사용자 피드백 "도트는 촌스럽다" → "평평한 그라데이션은 PPT 같다"): 게임 안 VS 장면과 같은 대각선 대결 구도 —
       * 왼쪽 붉은 번개 폭풍(피카츄)과 오른쪽 깊은 바다(거북왕)가 빛나는 대각선에서 부딪히고, 뒤로 빛줄기가 돈다. 두 포켓몬은 크게,
       * 화면 끝에 잘리게 마주 서고, 격투 게임식 BATTLE 엠블럼과 기울어진 두툼한 버튼. 상태와 문구는 Unity(TitleScreen)가 보낸다.
       * 크기는 모두 게임 폭 기준(cqw)이라 데스크톱 프레임과 휴대폰에서 같은 짜임으로 줄고 는다.
       */
      #title { position: absolute; inset: 0; overflow: hidden; color: #fff; text-align: center; background: #0a0716;
        font-family: "Noto Sans KR", "Noto Sans JP", "Apple SD Gothic Neo", "Hiragino Sans", "Malgun Gothic", "Yu Gothic", system-ui, sans-serif;
        transition: opacity 0.45s ease, visibility 0.45s; -webkit-tap-highlight-color: transparent; user-select: none; }
      #title[data-view="hidden"] { opacity: 0; visibility: hidden; pointer-events: none; }
      #title .display { font-family: "Black Han Sans", "Noto Sans KR", "Noto Sans JP", sans-serif; font-weight: 400; }
      /* 배경: 대각선으로 나뉜 두 세계 */
      #title .side { position: absolute; inset: 0; }
      #title .side.thunder { clip-path: polygon(0 0, 60% 0, 40% 100%, 0 100%);
        background:
          radial-gradient(45% 40% at 24% 66%, rgba(255, 214, 64, 0.85), rgba(255, 140, 0, 0.35) 45%, transparent 75%),
          linear-gradient(160deg, #3b0d2a 0%, #7c1a1f 45%, #c2410c 80%, #f59e0b 100%); }
      #title .side.tide { clip-path: polygon(60% 0, 100% 0, 100% 100%, 40% 100%);
        background:
          radial-gradient(48% 44% at 78% 60%, rgba(56, 189, 248, 0.7), rgba(14, 116, 144, 0.3) 50%, transparent 78%),
          linear-gradient(200deg, #020617 0%, #0b2a52 45%, #0e5a8a 80%, #22a3c9 100%); }
      /* 바다 쪽 물결 빛(코스틱), 번개 쪽 사선 번쩍임 */
      #title .side.tide::after { content: ""; position: absolute; inset: -20%; opacity: 0.09; mix-blend-mode: screen;
        background: repeating-radial-gradient(circle at 70% 120%, transparent 0 2.2cqw, rgba(186, 230, 253, 0.9) 2.4cqw 2.6cqw, transparent 2.8cqw 4.6cqw);
        animation: tide 9s linear infinite; }
      @keyframes tide { to { transform: translateY(-4.6cqw); } }
      #title .side.thunder::after { content: ""; position: absolute; inset: 0; opacity: 0.35; mix-blend-mode: screen;
        background: repeating-linear-gradient(115deg, transparent 0 7cqw, rgba(255, 236, 153, 0.5) 7cqw 7.3cqw, transparent 7.3cqw 15cqw);
        animation: flicker 3.4s steps(1) infinite; }
      @keyframes flicker { 0%, 100% { opacity: 0.25; } 8% { opacity: 0.7; } 10% { opacity: 0.2; } 12% { opacity: 0.55; } 40% { opacity: 0.3; } }
      /* 가운데에서 도는 빛줄기 */
      #title .rays { position: absolute; left: 50%; top: 42%; width: 190cqw; aspect-ratio: 1; translate: -50% -50%; mix-blend-mode: soft-light; opacity: 0.55;
        background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, 0.55) 0deg 5deg, transparent 5deg 15deg);
        mask: radial-gradient(closest-side, #000 15%, transparent 72%); animation: spin 40s linear infinite; }
      @keyframes spin { to { rotate: 360deg; } }
      /* 두 세계가 부딪히는 대각선: 흰 빛 */
      #title .seam { position: absolute; left: 50%; top: -10%; width: 1cqw; height: 120%; translate: -50% 0; rotate: 12.2deg;
        background: linear-gradient(transparent, #fff 20%, #fff 80%, transparent);
        box-shadow: 0 0 2cqw 0.8cqw rgba(255, 255, 255, 0.55), 0 0 6cqw 2cqw rgba(255, 220, 120, 0.35); animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.7; } }
      /* 바닥(무대)과 가장자리 어둡게 */
      #title .floor { position: absolute; left: -10%; right: -10%; bottom: -14%; height: 40%; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(0, 0, 0, 0.55), transparent); }
      #title .vignette { position: absolute; inset: 0; pointer-events: none; z-index: 4;
        background: radial-gradient(120% 95% at 50% 45%, transparent 55%, rgba(5, 3, 15, 0.7) 100%); }
      /* 불꽃(왼쪽)과 거품(오른쪽) */
      #title .spark, #title .bubble { position: absolute; bottom: -4%; z-index: 2; pointer-events: none; animation: rise linear infinite; }
      #title .spark { width: 0.6cqw; height: 2.6cqw; border-radius: 1cqw; background: linear-gradient(#fff7c2, #ffd23f); box-shadow: 0 0 1.4cqw #ffcf33; rotate: 12deg; }
      #title .bubble { width: 1.6cqw; aspect-ratio: 1; border-radius: 50%; border: 0.25cqw solid rgba(186, 230, 253, 0.85); background: rgba(186, 230, 253, 0.12); }
      @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-85cqw); opacity: 0; } }
      /* 피카츄와 거북왕이 크게 마주 선다 (Pokepedia 아트워크, 못 받으면 그냥 뺀다) */
      #title .mon { position: absolute; z-index: 3; pointer-events: none; animation: breathe 2.6s ease-in-out infinite; }
      #title .mon.left { width: 44cqw; left: -3%; bottom: 3%; scale: -1 1;
        filter: drop-shadow(0 0 0.5cqw #fff3b0) drop-shadow(0 0 3cqw rgba(255, 196, 0, 0.75)) drop-shadow(0 2cqw 2cqw rgba(0, 0, 0, 0.5)); }
      #title .mon.right { width: 60cqw; right: -9%; bottom: 0; animation-delay: -1.3s;
        filter: drop-shadow(0 0 0.5cqw #d9f3ff) drop-shadow(0 0 3cqw rgba(56, 189, 248, 0.7)) drop-shadow(0 2cqw 2cqw rgba(0, 0, 0, 0.5)); }
      @keyframes breathe { 50% { translate: 0 -0.8cqw; } }
      /* 격투 게임식 엠블럼: 작은 POKEPEDIA + 커다란 기울어진 BATTLE */
      #title .logo { position: absolute; top: 5.5%; left: 0; right: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; }
      #title .logo-top { font-size: 3.6cqw; letter-spacing: 0.32em; padding-left: 0.32em; color: #fff;
        text-shadow: 0 0.35cqw 0 #1a0b2e, 0 0 1.6cqw rgba(0, 0, 0, 0.6); }
      #title .logo-main { position: relative; margin-top: -0.4cqw; font-size: 17cqw; line-height: 0.95; letter-spacing: 0.01em; transform: skewX(-9deg);
        color: #ffd23f; -webkit-text-stroke: 1.2cqw #1a0b2e; paint-order: stroke fill;
        text-shadow: 0 1.1cqw 0 #1a0b2e, 0 1.6cqw 2.6cqw rgba(0, 0, 0, 0.55); }
      #title .logo-main::after { content: attr(data-text); position: absolute; inset: 0; -webkit-text-stroke: 0; text-shadow: none;
        background: linear-gradient(#fffbe0 0%, #ffe066 38%, #ffb703 62%, #f97316 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      /* 아래 영역: 로딩 / 버튼 / 안내 */
      #title .panel { position: absolute; left: 0; right: 0; bottom: 9%; z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 2.2cqw; padding: 0 6cqw; }
      #title .message { margin: 0; max-width: 78cqw; padding: 2.4cqw 4cqw; white-space: pre-line; border-radius: 1.4cqw;
        font-size: max(3cqw, 12px); line-height: 1.55; font-weight: 700; color: #fff;
        background: linear-gradient(rgba(16, 12, 40, 0.92), rgba(10, 8, 26, 0.92)); border: 0.45cqw solid #ffd23f;
        box-shadow: 0 0 0 0.45cqw #1a0b2e, 0 1.6cqw 3cqw rgba(0, 0, 0, 0.55); }
      #title .actions { display: flex; gap: 3cqw; flex-wrap: wrap; justify-content: center; }
      /* 게임 버튼: 기울어진 두툼한 판, 진한 테두리·아래 두께·빛이 쓸고 지나감 */
      #title button { position: relative; font: inherit; font-family: "Black Han Sans", "Noto Sans KR", "Noto Sans JP", sans-serif; font-weight: 400;
        font-size: max(4.4cqw, 16px); letter-spacing: 0.04em; color: #2a1200; cursor: pointer; border: 0; padding: 1.7cqw 7cqw 2cqw;
        background: linear-gradient(#fff3a6 0%, #ffd23f 45%, #ffae00 100%); transform: skewX(-12deg); border-radius: 0.8cqw;
        box-shadow: 0 0 0 0.5cqw #1a0b2e, 0 1.1cqw 0 0.5cqw #1a0b2e, 0 2cqw 3cqw rgba(0, 0, 0, 0.55), inset 0 -0.7cqw 0 rgba(180, 83, 9, 0.55);
        overflow: hidden; transition: transform 0.12s ease, box-shadow 0.12s ease; }
      #title button > span { display: inline-block; transform: skewX(12deg); }
      #title button::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%; transform: skewX(-20deg);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent); animation: shine 2.6s ease-in-out infinite; }
      @keyframes shine { 0%, 55% { left: -40%; } 85%, 100% { left: 130%; } }
      #title button.ghost { color: #fff; background: linear-gradient(#3b3f63, #23264a); box-shadow: 0 0 0 0.5cqw #0b0a1a, 0 1.1cqw 0 0.5cqw #0b0a1a, 0 2cqw 3cqw rgba(0, 0, 0, 0.5), inset 0 -0.7cqw 0 rgba(0, 0, 0, 0.35); }
      #title button.ghost::after { display: none; }
      #title button:hover { transform: skewX(-12deg) translateY(-0.3cqw); }
      #title button:active { transform: skewX(-12deg) translateY(0.9cqw); box-shadow: 0 0 0 0.5cqw #1a0b2e, 0 0.2cqw 0 0.5cqw #1a0b2e, inset 0 -0.4cqw 0 rgba(180, 83, 9, 0.55); }
      #title button:focus-visible { outline: 0.5cqw solid #fff; outline-offset: 1.2cqw; }
      #title[data-view="idle"] [data-action="start"] { animation: bob 1.6s ease-in-out infinite; }
      @keyframes bob { 50% { transform: skewX(-12deg) translateY(-0.5cqw) scale(1.03); } }
      /* 상태별로 보이는 것 */
      #title .loading, #title .message, #title [data-action] { display: none; }
      #title[data-view="loading"] .loading { display: flex; }
      #title[data-view="idle"] [data-action="start"],
      #title[data-view="failed"] [data-action="retry"],
      #title[data-view="failed"] [data-action="demo"],
      #title[data-view="no_partner"] [data-action="demo"] { display: inline-block; }
      #title[data-view="connecting"] .message,
      #title[data-view="failed"] .message,
      #title[data-view="no_partner"] .message { display: block; }
      #title[data-view="connecting"] .message::after { content: ""; display: inline-block; width: 1em; text-align: left; animation: dots 1.2s steps(4) infinite; }
      @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
      /* 로딩: 기울어진 막대에 줄무늬가 흐른다, 아래에 TIP */
      #title .loading { flex-direction: column; align-items: center; gap: 1.6cqw; width: 64cqw; }
      #title .barrow { display: flex; align-items: center; gap: 2cqw; width: 100%; }
      #title .bar { flex: 1; height: 2.6cqw; transform: skewX(-20deg); background: rgba(10, 8, 26, 0.85); border: 0.4cqw solid #1a0b2e;
        box-shadow: 0 0 0 0.3cqw rgba(255, 255, 255, 0.25), 0 1cqw 2cqw rgba(0, 0, 0, 0.5); overflow: hidden; }
      #title .fill { width: 0; height: 100%; transition: width 0.25s ease;
        background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.35) 0 1cqw, transparent 1cqw 2cqw), linear-gradient(#ffe066, #ffae00);
        background-size: 2.8cqw 100%, 100% 100%; animation: stripes 0.6s linear infinite; }
      @keyframes stripes { to { background-position: 2.8cqw 0, 0 0; } }
      #title .pct { min-width: 9cqw; text-align: right; font-size: max(3.6cqw, 13px); font-family: "Black Han Sans", sans-serif; color: #ffd23f;
        text-shadow: 0 0.3cqw 0 #1a0b2e; font-variant-numeric: tabular-nums; }
      #title .tip { display: flex; align-items: center; gap: 1.4cqw; font-size: max(2.4cqw, 11px); font-weight: 700; text-shadow: 0 0.2cqw 0.8cqw rgba(0, 0, 0, 0.8); }
      #title .tip::before { content: "TIP"; font-family: "Black Han Sans", sans-serif; font-size: 0.9em; letter-spacing: 0.1em; padding: 0.3cqw 1.2cqw;
        border-radius: 0.6cqw; background: #ffd23f; color: #1a0b2e; }
      #title .footer { position: absolute; left: 0; right: 0; bottom: 2.6%; z-index: 6; font-size: max(1.9cqw, 10px); font-weight: 500; opacity: 0.6;
        text-shadow: 0 0.2cqw 0.8cqw rgba(0, 0, 0, 0.9); }
      @media (prefers-reduced-motion: reduce) { #title *, #title *::after { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="stage"><div id="frame">
      <canvas id="unity-canvas" tabindex="0"></canvas>
      <div id="title" data-view="loading">
        <div class="side thunder"></div><div class="side tide"></div>
        <div class="rays"></div><div class="seam"></div><div class="floor"></div>
        <span class="spark" style="left:6%;animation-duration:3.2s;animation-delay:-0.4s"></span><span class="spark" style="left:14%;animation-duration:2.6s;animation-delay:-1.7s"></span><span class="spark" style="left:22%;animation-duration:3.6s;animation-delay:-2.3s"></span><span class="spark" style="left:30%;animation-duration:2.9s;animation-delay:-0.9s"></span><span class="spark" style="left:38%;animation-duration:3.3s;animation-delay:-2.9s"></span><span class="spark" style="left:10%;animation-duration:4.0s;animation-delay:-3.4s"></span><span class="spark" style="left:26%;animation-duration:2.4s;animation-delay:-0.2s"></span>
        <span class="bubble" style="left:62%;animation-duration:5.2s;animation-delay:-0.6s;width:1.4cqw"></span><span class="bubble" style="left:70%;animation-duration:6.4s;animation-delay:-2.8s;width:2.2cqw"></span><span class="bubble" style="left:78%;animation-duration:4.6s;animation-delay:-1.1s;width:1.2cqw"></span><span class="bubble" style="left:86%;animation-duration:5.8s;animation-delay:-3.9s;width:1.8cqw"></span><span class="bubble" style="left:93%;animation-duration:6.8s;animation-delay:-0.2s;width:1.5cqw"></span><span class="bubble" style="left:66%;animation-duration:7.4s;animation-delay:-4.6s;width:1.0cqw"></span><span class="bubble" style="left:82%;animation-duration:5.0s;animation-delay:-2.0s;width:2.6cqw"></span>
        <img class="mon left" src="https://wrodjycecfjxkmepxqhb.supabase.co/storage/v1/object/public/pokemon-artwork/normal/025.webp" alt="" onerror="this.remove()">
        <img class="mon right" src="https://wrodjycecfjxkmepxqhb.supabase.co/storage/v1/object/public/pokemon-artwork/normal/009.webp" alt="" onerror="this.remove()">
        <div class="vignette"></div>
        <div class="logo">
          <div class="logo-top display">POKEPEDIA</div>
          <div class="logo-main display" data-text="BATTLE">BATTLE</div>
        </div>
        <div class="panel">
          <div class="loading">
            <div class="barrow"><div class="bar"><div class="fill"></div></div><div class="pct">0%</div></div>
            <div class="tip"></div>
          </div>
          <p class="message"></p>
          <div class="actions">
            <button type="button" data-action="start"><span></span></button>
            <button type="button" class="ghost" data-action="retry"><span></span></button>
            <button type="button" data-action="demo"><span></span></button>
          </div>
        </div>
        <div class="footer"></div>
      </div>
    </div></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var title = document.querySelector("#title");
      var loadingFill = title.querySelector(".fill");
      var loadingText = title.querySelector(".pct");
      // 로딩 문구 언어: Pokepedia 는 ?lang= 을 붙여 띄우고, 없으면 브라우저 언어. 시작 화면 문구는 Unity 가 로케일 파일에서 보낸다
      var lang = (new URLSearchParams(location.search).get("lang") || navigator.language || "ko").slice(0, 2);
      var TEXT = {
        ko: { tip: "처음 불러올 때는 조금 걸려요. 다음부터는 빨라요.", ready: "준비 중…", failed: "불러오지 못했어요. 새로고침해 주세요.", footer: "© 2026 Pokepedia · 팬 프로젝트" },
        en: { tip: "The first load takes a moment. It is faster next time.", ready: "Getting ready…", failed: "Could not load. Please refresh.", footer: "© 2026 Pokepedia · Fan project" },
        ja: { tip: "はじめての よみこみは すこし じかんが かかります。", ready: "じゅんびちゅう…", failed: "よみこめませんでした。 リロードしてください。", footer: "© 2026 Pokepedia · ファンプロジェクト" }
      }[lang] || null;
      if (!TEXT) TEXT = { tip: "The first load takes a moment. It is faster next time.", ready: "Getting ready…", failed: "Could not load. Please refresh.", footer: "© 2026 Pokepedia · Fan project" };
      document.documentElement.lang = lang === "en" || lang === "ja" ? lang : "ko";
      title.querySelector(".tip").textContent = TEXT.tip;
      title.querySelector(".footer").textContent = TEXT.footer;

      // 시작 화면: Unity(TitleScreen) → HostBridge_ShowTitle → show(상태·문구). 버튼은 클릭 처리 안에서 바로 Unity 를 불러
      // 첫 소리(오디오 잠금 해제)가 막히지 않게 한다. 키보드(Z·Enter·Space)는 Unity 가 직접 받는다.
      window.pokeTitle = {
        show: function (v) {
          title.dataset.view = v.view;
          if (v.view === "hidden") return;
          var set = function (sel, text) { if (text != null) title.querySelector(sel).textContent = text; };
          set(".message", v.message);
          set('[data-action="start"] > span', v.start);
          set('[data-action="retry"] > span', v.retry);
          set('[data-action="demo"] > span', v.demo);
          set(".footer", v.footer);
        }
      };
      title.addEventListener("click", function (e) {
        var b = e.target.closest("button[data-action]");
        if (!b || !window.pokeHost.instance) return;
        window.pokeHost.instance.SendMessage("App", "OnTitleAction", b.dataset.action);
        canvas.focus();
      });

      // 호스트(Pokepedia) origin 허용 목록. init 수신 검증과 jslib 의 postMessage 대상에 함께 쓴다.
      // 규약: docs/PROJECT.md 9.2
      window.pokeHost = {
        instance: null,
        pending: [],
        allowedOrigins: ["https://pokepedia.dev", "https://www.pokepedia.dev", "http://localhost:3000", "http://localhost:8000"]
      };
      // Pokepedia 의 Vercel Preview 는 PR 마다 주소가 달라 목록에 미리 넣을 수 없다. 부모 페이지 origin 이
      // 이 계정의 Pokepedia Preview 형식이면 목록에 더한다(9.2). ancestorOrigins 가 없는 브라우저(Firefox)는 referrer 로 본다.
      (function () {
        var PREVIEW = /^https:\/\/pokepedia-[a-z0-9-]+-vison901-gmailcoms-projects\.vercel\.app$/;
        try {
          var parent = (location.ancestorOrigins && location.ancestorOrigins[0]) || (document.referrer && new URL(document.referrer).origin);
          if (parent && PREVIEW.test(parent)) window.pokeHost.allowedOrigins.push(parent);
        } catch (e) {}
      })();

      // iframe 안에서 방향키·스페이스가 부모 페이지를 스크롤하지 않도록 막는다
      var BLOCKED = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"];
      window.addEventListener("keydown", function (e) { if (BLOCKED.indexOf(e.code) >= 0) e.preventDefault(); }, { passive: false });
      // iPhone 은 무음 모드(측면 스위치)면 Web Audio(=Unity 소리)를 끈다. "playback" 이면 동영상처럼 소리가 난다(iOS 17+, 없으면 무시).
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
      // 클릭/터치 시 캔버스에 포커스를 줘야 키 입력이 iframe 안에서 Unity 로 전달된다
      ["pointerdown", "touchstart"].forEach(function (ev) { document.addEventListener(ev, function () { canvas.focus(); window.focus(); }, { passive: true }); });

      // 호스트 → Unity: origin 검증 후 전달. Unity 로딩 전에 오면 보관했다가 전달한다.
      window.addEventListener("message", function (e) {
        if (window.pokeHost.allowedOrigins.indexOf(e.origin) < 0) return;
        var d = e.data;
        if (!d || typeof d !== "object" || d.type !== "init") return;
        var json = JSON.stringify(d);
        if (window.pokeHost.instance) window.pokeHost.instance.SendMessage("HostBridge", "OnHostInit", json);
        else window.pokeHost.pending.push(json);
      });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Unity 는 처리되지 않은 오류를 alert 로 띄운다. 소리 하나를 풀지 못한 오류(게임은 계속 돈다)는 콘솔에만 남긴다.
        // true 를 돌려주면 기본 alert 를 건너뛴다. 그 밖의 오류는 기본 동작 그대로.
        errorHandler: function (message) {
          if (/EncodingError|Decoding failed|decodeAudioData/.test(String(message))) { console.warn("[audio] " + message); return true; }
          return false;
        },
      }, function (p) {
        // 0~0.9 는 내려받기, 그 뒤는 엔진 초기화
        loadingFill.style.width = Math.round(p * 100) + "%";
        loadingText.textContent = p >= 0.9 ? TEXT.ready : Math.round(p * 100) + "%";
      })
      .then(function (instance) {
        window.pokeHost.instance = instance;
        window.pokeHost.pending.splice(0).forEach(function (j) { instance.SendMessage("HostBridge", "OnHostInit", j); });
      }).catch(function (m) { loadingText.textContent = TEXT.failed; console.error(m); });
    </script>
  </body>
</html>
